name: Déploiement Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploiement
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache des images optimisées
        uses: actions/cache@v4
        with:
          path: public/img
          key: img-${{ hashFiles('images/**') }}
      - run: npm run build
      - name: Secrets FTP manquants
        if: ${{ env.FTP_SERVER == '' }}
        run: echo "::warning::Ajoutez FTP_SERVER, FTP_USERNAME et FTP_PASSWORD dans Settings > Secrets > Actions, puis relancez ce workflow."
      - name: Envoi FTP (racine du compte FTP crfperfection.pro)
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/client/
          server-dir: ./
          timeout: 120000
